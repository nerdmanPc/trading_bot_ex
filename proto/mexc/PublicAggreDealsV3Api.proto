// spot@public.aggre.deals.v3.api.pb

syntax = "proto3";

option optimize_for = SPEED;

message PublicAggreDealsV3Api {
  string channel = 1;
  string symbol = 3;
  int64 sendTime = 6;
  PublicAggreDeals payload = 314;
}

message PublicAggreDeals {
  repeated Deal deals  = 1;
  string eventType = 2;
}

message Deal {
  string price = 1;
  string quantity = 2;
  int32 tradeType = 3;
  int64 time = 4;
}
